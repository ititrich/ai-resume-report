name = "ai-resume-api"
main = "src/index.js"
# 오늘(UTC 2026-09-21)이 아니라 이틀 전 날짜
compatibility_date = "2026-09-19"

# 같은 IP 1분에 5번 제한 (Cloudflare Rate Limiting)
[[ratelimits]]
name = "FREE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# API 키는 여기에 쓰지 마세요.
# 배포 전에 `npx wrangler secret put ANTHROPIC_API_KEY` 로 등록합니다.
